<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasetka player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#yt{width:100%;height:100%}</style>
</head>
<body>
<div id="yt"></div>
<script>
// The playback engine for the Kasetka Android app. The app loads this page in a hidden view and
// drives it through window.kp; state is reported back through the Android bridge.
const A = window.Android || { onState(){}, onQueue(){}, onReady(){}, onError(){}, onEnded(){} };
let p = null, apiReady = false, ready = false, wantPlay = false, lastIds = '', want = null, watchdog = null;
let jumpTo = 0, seekAfter = 0, current = null, blockedRun = 0;

// A brand-new YouTube player for every tape, with the playlist given the standard embed way
// (playlist inside the player settings). Loading playlists into an existing player fails with error 2.
function create(t) {
  ready = false; current = t; blockedRun = 0;
  if (p) { try { p.destroy(); } catch (_) {} p = null; }
  document.body.innerHTML = '<div id="yt"></div>';
  clearTimeout(watchdog);
  const vars = { playsinline: 1, controls: 0, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin };
  const opts = { width: '100%', height: '100%', playerVars: vars };
  const listOk = t.list && !/^RD/.test(t.list);
  jumpTo = t.index || 0; seekAfter = t.time || 0;
  if (listOk) {
    vars.listType = 'playlist'; vars.list = t.list;
  } else if (t.videos && t.videos.length) {
    opts.videoId = t.videos[0];
    if (t.videos.length > 1) vars.playlist = t.videos.slice(1).join(',');
  } else if (t.video) {
    opts.videoId = t.video;
  } else { A.onError(-3); return; }
  if (jumpTo === 0 && seekAfter > 0) vars.start = Math.floor(seekAfter);
  if (jumpTo === 0) seekAfter = 0;
  console.log('start ' + JSON.stringify(t));
  opts.events = {
    onReady() {
      ready = true; A.onReady();
      if (t.play || wantPlay) { wantPlay = false; kp.play(); }
    },
    onStateChange(e) {
      let v = ''; try { v = (p.getVideoData() || {}).video_id || ''; } catch (_) {}
      let n = 0; try { n = (p.getPlaylist() || []).length; } catch (_) {}
      console.log('state ' + e.data + ' video ' + v + ' songs ' + n);
      if (e.data === 1) blockedRun = 0;
      if (e.data === 1 && seekAfter > 0) { const s = seekAfter; seekAfter = 0; p.seekTo(s, true); }
      if (e.data === 0) {
        let l = null, i = 0;
        try { l = p.getPlaylist(); i = p.getPlaylistIndex(); } catch (_) {}
        if (!l || i >= l.length - 1) A.onEnded();
      }
      push();
    },
    onError(e) {
      let v = ''; try { v = (p.getVideoData() || {}).video_id || ''; } catch (_) {}
      console.log('error ' + e.data + ' on video ' + v);
      A.onError(e.data);
      if ([100, 101, 150, 152, 153].includes(e.data) && (t.list || (t.videos && t.videos.length > 1))) {
        blockedRun++;
        if (blockedRun >= 6) { A.onError(-5); return; }   // many songs in a row are blocked: stop and say so
        setTimeout(() => { try { p.nextVideo(); } catch (_) {} }, 600);
      }
    }
  };
  p = new YT.Player('yt', opts);
}

function onYouTubeIframeAPIReady() {
  apiReady = true;
  if (want) { const w = want; want = null; create(w); }
}

function push() {
  if (!ready) return;
  let ids = null, vd = {}, st = -1;
  try { ids = p.getPlaylist(); vd = p.getVideoData() || {}; st = p.getPlayerState(); } catch (_) {}
  A.onState(JSON.stringify({
    playing: st === 1 || st === 3, state: st,
    time: p.getCurrentTime ? (p.getCurrentTime() || 0) : 0,
    duration: p.getDuration ? (p.getDuration() || 0) : 0,
    index: Math.max(0, p.getPlaylistIndex ? p.getPlaylistIndex() : 0),
    videoId: vd.video_id || '', title: vd.title || '', author: vd.author || ''
  }));
  const j = JSON.stringify(ids || (vd.video_id ? [vd.video_id] : []));
  if (j !== lastIds && j !== '[]') { lastIds = j; A.onQueue(j); }
}
setInterval(push, 500);

window.kp = {
  load(t) {
    lastIds = '';
    if (!apiReady) { want = t; return; }
    create(t);
  },
  play() {
    if (!ready || !p || !p.playVideo) { wantPlay = true; return; }
    if (jumpTo > 0) { const i = jumpTo; jumpTo = 0; p.playVideoAt(i); } else p.playVideo();
    clearTimeout(watchdog);
    const t = current;
    watchdog = setTimeout(() => {
      let vid = '', st = -1;
      try { vid = (p.getVideoData() || {}).video_id || ''; st = p.getPlayerState(); } catch (_) {}
      if (!vid && st !== 1 && st !== 3 && t) {
        if (t.list && t.video) { A.onError(-4); kp.load(Object.assign({}, t, { list: null, index: 0, time: 0, play: true })); }
        else A.onError(-2);
      }
    }, 8000);
  },
  pause() { wantPlay = false; if (ready && p && p.pauseVideo) p.pauseVideo(); },
  stop() { p && p.stopVideo(); },
  next() { p && p.nextVideo(); },
  prev() { if (!p) return; if (p.getCurrentTime() > 3) p.seekTo(0, true); else p.previousVideo(); },
  seekBy(d) { p && p.seekTo(Math.max(0, p.getCurrentTime() + d), true); },
  seek(s) { p && p.seekTo(s, true); },
  at(i) { p && p.playVideoAt(i); }
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
